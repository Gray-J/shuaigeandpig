<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双人笔记 · OneNote 风格</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root { --bg: #faf9f7; --fg: #1a1a1a; --border: #ddd; --muted: #888; --accent: #5b4a9e; --tab-bg: #e8e4f0; }
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* 认证栏 */
  #authBar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: #f0ede8; border-bottom: 1px solid var(--border); flex-wrap: wrap; flex-shrink: 0; }
  #authBar input { font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  #authBar input[type="password"] { flex: 1; min-width: 200px; }
  #authBar button { font: inherit; padding: 6px 14px; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }

  /* 主布局 */
  #app { flex: 1; display: flex; min-height: 0; }

  /* 左侧垂直标签栏（OneNote 分区风格） */
  aside#sections { width: 220px; background: #f3f0eb; border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; }
  .section-header { padding: 10px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .folder { padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; border-radius: 0; user-select: none; }
  .folder:hover { background: #e8e4dd; }
  .folder .icon { font-size: 14px; }
  .folder .count { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 11px; }
  .note-item { padding: 6px 14px 6px 34px; cursor: pointer; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #333; }
  .note-item:hover { background: #e8e4dd; }
  .note-item.active { background: var(--tab-bg); font-weight: 600; color: var(--accent); }
  .new-btn { margin: 8px 14px; padding: 6px; font-size: 12px; border: 1px dashed var(--border); border-radius: 6px; background: transparent; cursor: pointer; color: var(--muted); }

  /* 右侧编辑区 */
  main#editorArea { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* 顶部编辑标签页（多笔记同时打开） */
  #tabBar { display: flex; background: #e8e4f0; border-bottom: 1px solid var(--border); overflow-x: auto; flex-shrink: 0; min-height: 38px; }
  .edit-tab { padding: 8px 14px; font-size: 13px; cursor: pointer; border-right: 1px solid var(--border); display: flex; align-items: center; gap: 8px; white-space: nowrap; background: #ddd6e8; color: #555; }
  .edit-tab.active { background: #fff; color: var(--fg); font-weight: 600; }
  .edit-tab .close { font-size: 16px; line-height: 1; opacity: .6; }
  .edit-tab .close:hover { opacity: 1; color: #c00; }
  .edit-tab .dot { width: 6px; height: 6px; border-radius: 50%; background: #c00; flex-shrink: 0; }

  /* 编辑 + 预览 */
  .panes { flex: 1; display: flex; min-height: 0; }
  textarea, .preview { width: 50%; padding: 18px; border: none; outline: none; font: 14px/1.7 ui-monospace, "Cascadia Code", monospace; resize: none; background: #fff; overflow-y: auto; }
  textarea { border-right: 1px solid var(--border); }
  .preview { background: #fdfcfb; }
  .preview h1, .preview h2, .preview h3 { margin: 1em 0 .4em; line-height: 1.3; }
  .preview p { margin: .6em 0; } .preview pre { background: #f0ede8; padding: 12px; border-radius: 6px; overflow-x: auto; }
  .preview code { font-size: .9em; background: #f0ede8; padding: 2px 5px; border-radius: 3px; }

  /* 状态与工具 */
  #statusBar { padding: 6px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); display: flex; gap: 16px; flex-shrink: 0; background: #faf9f7; }
  #statusBar .save-state { cursor: pointer; }
  #statusBar .save-state:hover { text-decoration: underline; }
  .hidden { display: none !important; }
  @media (max-width: 700px) {
    aside#sections { width: 160px; }
    .panes { flex-direction: column; }
    textarea, .preview { width: 100%; height: 50%; }
    textarea { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<!-- 认证栏 -->
<div id="authBar">
  <span>GitHub PAT：</span>
  <input id="token" type="password" placeholder="粘贴 Fine-grained PAT（仅限此仓库 Contents 读写）" />
  <input id="repo" type="text" placeholder="owner/repo" style="flex:0 1 200px" />
  <button onclick="saveAuth()">连接</button>
  <span style="font-size:11px;color:#888" id="authHint">首次使用需粘贴令牌，之后浏览器会自动记住</span>
</div>

<!-- 主应用 -->
<div id="app" class="hidden" style="display:flex;flex-direction:column;height:100vh">

  <div style="display:flex;flex:1;min-height:0">
    <!-- 左侧垂直标签栏 -->
    <aside id="sections">
      <div class="section-header">笔记本</div>
      <div id="folderList"></div>
      <button class="new-btn" onclick="createFolder()">＋ 新建分区</button>
    </aside>

    <!-- 右侧编辑区 -->
    <main id="editorArea">
      <div id="tabBar"></div>
      <div class="panes">
        <textarea id="editor" placeholder="在左侧选择一篇笔记，或新建一篇…" spellcheck="false"></textarea>
        <div class="preview" id="preview"></div>
      </div>
    </main>
  </div>

  <div id="statusBar">
    <span class="save-state" id="saveState" onclick="saveCurrent()">保存（Ctrl/Cmd + S）</span>
    <span id="conflictHint" style="color:#c00;display:none">⚠️ 远端有更新</span>
    <span id="statusMsg" style="margin-left:auto"></span>
  </div>
</div>

<script>
// ==================== 配置与状态 ====================
const API = 'https://api.github.com';
let TOKEN = '', OWNER = '', REPO = '';

// 已打开的编辑标签页：[{ path, name, content, sha, dirty }]
let openTabs = [];
let activeTabIndex = -1;

// 仓库结构缓存：{ folders: [{ name, path, notes: [{name, path, sha}] }] }
let repoTree = { folders: [] };

// ==================== 认证 ====================
function saveAuth() {
  TOKEN = document.getElementById('token').value.trim();
  const r = document.getElementById('repo').value.trim();
  if (!TOKEN || !r.includes('/')) { alert('请填写 PAT 和 owner/repo'); return; }
  [OWNER, REPO] = r.split('/');
  localStorage.setItem('gh_token', TOKEN);
  localStorage.setItem('gh_repo', r);
  document.getElementById('authBar').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  init();
}

(function restoreAuth() {
  const t = localStorage.getItem('gh_token');
  const r = localStorage.getItem('gh_repo');
  if (t && r) {
    document.getElementById('token').value = t;
    document.getElementById('repo').value = r;
    saveAuth();
  }
})();

// ==================== GitHub API ====================
async function gh(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${TOKEN}`,
      'Accept': 'application/vnd.github+json',
      ...(opts.headers || {}),
    },
  });
  if (!res.ok && res.status !== 404) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `API ${res.status}`);
  }
  return res;
}

function b64encode(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64decode(s) { return decodeURIComponent(escape(atob(s))); }
function setStatus(msg) { document.getElementById('statusMsg').textContent = msg; }

// ==================== 初始化：读取仓库树 ====================
async function init() {
  setStatus('读取仓库结构…');
  try {
    const res = await gh(`/repos/${OWNER}/${REPO}/contents/`);
    const items = await res.json();

    // 文件夹 = 分区；根目录的 .md 文件 = 未分区的笔记
    const folders = [];
    const rootNotes = [];
    for (const item of items) {
      if (item.type === 'dir') {
        folders.push({ name: item.name, path: item.path, notes: [] });
      } else if (item.name.endsWith('.md') && item.type === 'file') {
        rootNotes.push({ name: item.name.replace(/\.md$/, ''), path: item.path, sha: item.sha });
      }
    }

    // 读取每个文件夹内的 md 文件
    for (const f of folders) {
      const fres = await gh(`/repos/${OWNER}/${REPO}/contents/${f.path}`);
      const fitems = await fres.json();
      if (Array.isArray(fitems)) {
        f.notes = fitems
          .filter(x => x.name.endsWith('.md') && x.type === 'file')
          .map(x => ({ name: x.name.replace(/\.md$/, ''), path: x.path, sha: x.sha }));
      }
    }

    // 如果有根目录笔记但没有文件夹，把它们归入"未分区"
    if (rootNotes.length > 0) {
      folders.unshift({ name: '未分区', path: '', notes: rootNotes, isRoot: true });
    }
    repoTree.folders = folders;
    renderSections();
    setStatus(`已连接 · ${folders.length} 个分区`);
  } catch (e) {
    setStatus('连接失败：' + e.message);
  }
}

// ==================== 左侧垂直标签栏 ====================
function renderSections() {
  const container = document.getElementById('folderList');
  container.innerHTML = '';

  if (repoTree.folders.length === 0) {
    container.innerHTML = '<div style="padding:14px;color:#888;font-size:13px">仓库中还没有文件夹。<br>点击下方新建一个分区。</div>';
    return;
  }

  repoTree.folders.forEach(folder => {
    const header = document.createElement('div');
    header.className = 'folder';
    header.innerHTML = `<span class="icon">📁</span> ${folder.name} <span class="count">${folder.notes.length}</span>`;
    container.appendChild(header);

    folder.notes.forEach(note => {
      const div = document.createElement('div');
      div.className = 'note-item' + (isActive(note.path) ? ' active' : '');
      div.textContent = note.name;
      div.title = note.path;
      div.onclick = () => openNote(note.path, note.name, note.sha);
      container.appendChild(div);
    });
  });
}

function isActive(path) {
  return openTabs[activeTabIndex]?.path === path;
}

// ==================== 编辑标签页（多笔记同时打开） ====================
function openNote(path, name, sha) {
  // 如果已经打开，直接切换
  const existing = openTabs.findIndex(t => t.path === path);
  if (existing >= 0) { activeTabIndex = existing; renderAll(); return; }

  // 如果当前标签有未保存修改，先保留在内存中（不弹窗打断）
  // 新标签先以空内容占位，然后异步拉取
  openTabs.push({ path, name, content: '', sha, dirty: false, loading: true });
  activeTabIndex = openTabs.length - 1;
  renderAll();
  loadTabContent(activeTabIndex);
}

async function loadTabContent(index) {
  const tab = openTabs[index];
  try {
    const res = await gh(`/repos/${OWNER}/${REPO}/contents/${tab.path}`);
    const data = await res.json();
    tab.content = b64decode(data.content);
    tab.sha = data.sha;
    tab.loading = false;
    if (activeTabIndex === index) renderEditor();
    renderTabBar();
  } catch (e) {
    setStatus('读取失败：' + e.message);
    tab.loading = false;
  }
}

function closeTab(index) {
  const tab = openTabs[index];
  if (tab.dirty && !confirm(`「${tab.name}」有未保存修改，确定关闭？`)) return;
  openTabs.splice(index, 1);
  if (openTabs.length === 0) { activeTabIndex = -1; }
  else if (activeTabIndex >= openTabs.length) { activeTabIndex = openTabs.length - 1; }
  else if (index <= activeTabIndex && activeTabIndex > 0) { activeTabIndex--; }
  renderAll();
}

function switchTab(index) {
  activeTabIndex = index;
  renderAll();
}

function renderTabBar() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  openTabs.forEach((tab, i) => {
    const el = document.createElement('div');
    el.className = 'edit-tab' + (i === activeTabIndex ? ' active' : '');
    el.onclick = () => switchTab(i);
    el.innerHTML = `${tab.dirty ? '<span class="dot"></span>' : ''} ${tab.name} <span class="close" onclick="event.stopPropagation(); closeTab(${i})">×</span>`;
    bar.appendChild(el);
  });
}

function renderEditor() {
  const tab = openTabs[activeTabIndex];
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  if (!tab) {
    editor.value = ''; preview.innerHTML = '';
    editor.placeholder = '在左侧选择一篇笔记，或新建一篇…';
    return;
  }
  if (tab.loading) {
    editor.value = '读取中…'; preview.innerHTML = '';
    return;
  }
  editor.value = tab.content;
  preview.innerHTML = marked.parse(tab.content);
  editor.placeholder = '书写 Markdown…';
}

function renderAll() {
  renderTabBar();
  renderEditor();
  renderSections();
  updateSaveState();
}

// ==================== 编辑监听 ====================
document.getElementById('editor').addEventListener('input', () => {
  const tab = openTabs[activeTabIndex];
  if (!tab) return;
  tab.content = document.getElementById('editor').value;
  tab.dirty = true;
  document.getElementById('preview').innerHTML = marked.parse(tab.content);
  updateSaveState();
});

function updateSaveState() {
  const tab = openTabs[activeTabIndex];
  const el = document.getElementById('saveState');
  if (!tab) { el.textContent = '—'; return; }
  el.textContent = tab.dirty ? '● 未保存 · 点击保存' : '已保存 ✓';
  el.style.color = tab.dirty ? '#c00' : '#2a7a2a';
}

// ==================== 保存（SHA 乐观锁冲突处理） ====================
async function saveCurrent() {
  const tab = openTabs[activeTabIndex];
  if (!tab || !tab.path) { alert('没有打开任何笔记'); return; }
  if (tab.loading) return;

  setStatus('保存中…');
  try {
    // 1. 保存前获取远端最新 SHA
    let remoteSha = null, remoteContent = null;
    const getRes = await gh(`/repos/${OWNER}/${REPO}/contents/${tab.path}`);
    if (getRes.ok) {
      const meta = await getRes.json();
      remoteSha = meta.sha;
      remoteContent = b64decode(meta.content);
    }

    // 2. 冲突检测：打开时的 SHA 与远端最新 SHA 不一致
    if (tab.sha && remoteSha && tab.sha !== remoteSha && remoteContent !== tab.content) {
      const choice = await showConflictDialog(tab, remoteContent);
      if (choice === 'cancel') { setStatus('已取消保存'); return; }
      if (choice === 'merge') {
        // 将远端内容载入编辑器，用户手动合并；同时保留自己原本的内容在草稿中
        tab._draftBeforeConflict = tab.content;
        tab.content = remoteContent;
        tab.sha = remoteSha;
        tab.dirty = true;
        if (activeTabIndex >= 0) renderEditor();
        setStatus('已载入远端最新版本。你之前的修改已暂存，合并后再次保存即可。');
        return;
      }
      if (choice === 'overwrite') {
        // 用户明确选择强制覆盖：用远端最新 SHA 作为 base，写入自己的内容
        tab.sha = remoteSha;
      }
    }

    // 3. 执行 PUT
    const body = {
      message: `更新 ${tab.path}`,
      content: b64encode(tab.content),
      sha: tab.sha || undefined,
    };
    const res = await gh(`/repos/${OWNER}/${REPO}/contents/${tab.path}`, {
      method: 'PUT',
      body: JSON.stringify(body),
      headers: { 'Content-Type': 'application/json' },
    });
    const data = await res.json();
    tab.sha = data.content.sha;
    tab.dirty = false;
    tab._draftBeforeConflict = null;
    updateSaveState();
    renderTabBar();
    setStatus('已保存 ✓');
    // 刷新左侧列表中的 SHA（不重建整个树，简单起见重新拉取）
    await refreshFolderSha(tab.path);
  } catch (e) {
    if (e.message.includes('409') || e.message.includes('422')) {
      alert('保存被拒绝：远端在提交前又被修改了。请再次保存以查看最新版本。');
      tab.sha = null; // 强制下次保存重新获取
    } else {
      alert('保存失败：' + e.message);
    }
    setStatus('保存失败');
  }
}

// 冲突对话框：返回 'merge' | 'overwrite' | 'cancel'
function showConflictDialog(tab, remoteContent) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px';
    overlay.innerHTML = `
      <div style="background:#fff;border-radius:10px;padding:20px;max-width:600px;width:100%;max-height:80vh;display:flex;flex-direction:column">
        <h3 style="margin-bottom:8px">⚠️ 这篇笔记已被对方修改</h3>
        <p style="font-size:13px;color:#555;margin-bottom:12px">对方的最新版本如下。你可以选择载入它进行手动合并，或者用自己的版本强制覆盖（会丢失对方改动）。</p>
        <pre style="background:#f5f3f0;padding:12px;border-radius:6px;overflow:auto;font-size:12px;max-height:40vh;white-space:pre-wrap">${escapeHtml(remoteContent.slice(0, 3000))}${remoteContent.length > 3000 ? '\n…（已截断）' : ''}</pre>
        <div style="display:flex;gap:10px;margin-top:14px;justify-content:flex-end">
          <button onclick="resolveConflict('cancel')" style="padding:8px 16px;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer">取消</button>
          <button onclick="resolveConflict('overwrite')" style="padding:8px 16px;border:1px solid #c00;background:#fff;color:#c00;border-radius:6px;cursor:pointer">强制覆盖</button>
          <button onclick="resolveConflict('merge')" style="padding:8px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;cursor:pointer">载入对方版本合并</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    window.resolveConflict = (choice) => {
      overlay.remove();
      delete window.resolveConflict;
      resolve(choice);
    };
  });
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function refreshFolderSha(path) {
  // 简单重建树，确保左侧列表的 SHA 是最新的
  try { await init(); } catch (e) {}
}

// ==================== 新建笔记 / 分区 ====================
async function createNote() {
  const folder = prompt('输入分区名称（留空则放在根目录）：') || '';
  const name = prompt('输入笔记名称（无需 .md）：');
  if (!name) return;
  const path = folder ? `${folder}/${name}.md` : `${name}.md`;

  // 如果文件夹不存在，先创建 .gitkeep
  if (folder) {
    const fRes = await gh(`/repos/${OWNER}/${REPO}/contents/${folder}`);
    if (fRes.status === 404) {
      await gh(`/repos/${OWNER}/${REPO}/contents/${folder}/.gitkeep`, {
        method: 'PUT',
        body: JSON.stringify({ message: `新建分区 ${folder}`, content: b64encode('') }),
        headers: { 'Content-Type': 'application/json' },
      });
    }
  }

  // 创建空笔记
  const body = {
    message: `新建 ${path}`,
    content: b64encode(`# ${name}\n\n`),
  };
  try {
    const res = await gh(`/repos/${OWNER}/${REPO}/contents/${path}`, {
      method: 'PUT',
      body: JSON.stringify(body),
      headers: { 'Content-Type': 'application/json' },
    });
    const data = await res.json();
    await init();
    openNote(path, name, data.content.sha);
    setStatus('已创建：' + path);
  } catch (e) { alert('创建失败：' + e.message); }
}

function createFolder() {
  const name = prompt('新分区名称：');
  if (!name || !name.trim()) return;
  const folder = name.trim();
  gh(`/repos/${OWNER}/${REPO}/contents/${folder}/.gitkeep`, {
    method: 'PUT',
    body: JSON.stringify({ message: `新建分区 ${folder}`, content: b64encode('') }),
    headers: { 'Content-Type': 'application/json' },
  }).then(() => init()).then(() => setStatus('分区已创建：' + folder))
    .catch(e => alert('创建失败：' + e.message));
}

// ==================== 快捷键 ====================
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); saveCurrent(); }
});

// 暴露新建入口到状态栏（简单起见）
document.getElementById('statusBar').insertAdjacentHTML('beforeend',
  '<span style="cursor:pointer;margin-left:8px" onclick="createNote()">＋ 新建笔记</span>');
</script>
</body>
</html>
