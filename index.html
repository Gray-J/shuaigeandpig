<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双人笔记 · 极简</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root { --bg: #faf9f7; --fg: #1a1a1a; --border: #e2ddd6; --muted: #999; --accent: #5b4a9e; --tab-bg: #e8e4f0; }
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #authBar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: #f0ede8; border-bottom: 1px solid var(--border); flex-wrap: wrap; flex-shrink: 0; }
  #authBar input { font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  #authBar input[type="password"] { flex: 1; min-width: 200px; }
  #authBar button { font: inherit; padding: 6px 14px; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }

  #app { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #app > .row { display: flex; flex: 1; min-height: 0; }

  aside#sections { width: 220px; background: #f3f0eb; border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
  .section-header { padding: 10px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .folder { padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; user-select: none; }
  .folder:hover { background: #e8e4dd; }
  .folder .count { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 11px; }
  .note-item { padding: 6px 14px 6px 34px; cursor: pointer; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #333; }
  .note-item:hover { background: #e8e4dd; }
  .note-item.active { background: var(--tab-bg); font-weight: 600; color: var(--accent); }
  .new-btn { margin: 8px 14px; padding: 6px; font-size: 12px; border: 1px dashed var(--border); border-radius: 6px; background: transparent; cursor: pointer; color: var(--muted); }

  main#editorArea { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }

  #tabBar { display: flex; background: #e8e4f0; border-bottom: 1px solid var(--border); overflow-x: auto; flex-shrink: 0; min-height: 38px; }
  .edit-tab { padding: 8px 14px; font-size: 13px; cursor: pointer; border-right: 1px solid var(--border); display: flex; align-items: center; gap: 8px; white-space: nowrap; background: #ddd6e8; color: #555; }
  .edit-tab.active { background: #fff; color: var(--fg); font-weight: 600; }
  .edit-tab .close { font-size: 16px; line-height: 1; opacity: .6; }
  .edit-tab .close:hover { opacity: 1; color: #c00; }
  .edit-tab .dot { width: 6px; height: 6px; border-radius: 50%; background: #c00; flex-shrink: 0; }

  .editor-wrap { flex: 1; overflow-y: auto; }
  .editor {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 44px 160px;
    outline: none;
    font: 16px/1.85 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100%;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .editor:empty::before { content: attr(data-placeholder); color: #bbb; pointer-events: none; }
  .editor h1 { font-size: 1.7em; margin: .7em 0 .4em; }
  .editor h2 { font-size: 1.4em; margin: .7em 0 .4em; }
  .editor h3 { font-size: 1.2em; margin: .6em 0 .3em; }
  .editor p { margin: .5em 0; }
  .editor ul, .editor ol { padding-left: 1.6em; margin: .5em 0; }
  .editor blockquote { border-left: 3px solid #ccc; padding-left: 12px; color: #666; margin: .6em 0; }
  .editor pre { background: #f3f0eb; padding: 12px; border-radius: 6px; overflow-x: auto; font: 13px/1.6 ui-monospace, monospace; }

  #statusBar { padding: 6px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); display: flex; gap: 16px; flex-shrink: 0; background: #faf9f7; align-items: center; }
  #statusBar .save-state { cursor: pointer; user-select: none; }
  #statusBar .save-state:hover { text-decoration: underline; }
  .hidden { display: none !important; }
  @media (max-width: 700px) {
    aside#sections { width: 150px; }
    .editor { padding: 20px 18px 120px; }
  }
</style>
</head>
<body>

<div id="authBar">
  <span>GitHub PAT：</span>
  <input id="token" type="password" placeholder="粘贴 Fine-grained PAT（仅限此仓库 Contents 读写）" />
  <input id="repo" type="text" placeholder="owner/repo" style="flex:0 1 200px" />
  <button onclick="saveAuth()">连接</button>
  <span style="font-size:11px;color:#888">首次使用需粘贴令牌，之后浏览器会自动记住</span>
</div>

<div id="app" class="hidden">
  <div class="row">
    <aside id="sections">
      <div class="section-header">笔记本</div>
      <div id="folderList"></div>
      <button class="new-btn" onclick="createFolder()">＋ 新建分区</button>
    </aside>
    <main id="editorArea">
      <div id="tabBar"></div>
      <div class="editor-wrap">
        <div class="editor" id="editor" contenteditable="true" spellcheck="false" data-placeholder="开始书写…"></div>
      </div>
    </main>
  </div>
  <div id="statusBar">
    <span class="save-state" id="saveState" onclick="saveCurrent()">保存（Ctrl/Cmd + S）</span>
    <span id="statusMsg" style="margin-left:auto"></span>
  </div>
</div>

<script>
const API = 'https://api.github.com';
let TOKEN = '', OWNER = '', REPO = '';
let openTabs = [];
let activeTabIndex = -1;
let repoTree = { folders: [] };

const editor = document.getElementById('editor');
let renderTimer = null;

// ==================== 认证 ====================
function saveAuth() {
  TOKEN = document.getElementById('token').value.trim();
  const r = document.getElementById('repo').value.trim();
  if (!TOKEN || !r.includes('/')) { alert('请填写 PAT 和 owner/repo'); return; }
  [OWNER, REPO] = r.split('/');
  localStorage.setItem('gh_token', TOKEN);
  localStorage.setItem('gh_repo', r);
  document.getElementById('authBar').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  init();
}
(function restoreAuth() {
  const t = localStorage.getItem('gh_token');
  const r = localStorage.getItem('gh_repo');
  if (t && r) {
    document.getElementById('token').value = t;
    document.getElementById('repo').value = r;
    saveAuth();
  }
})();

// ==================== GitHub API ====================
async function gh(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${TOKEN}`,
      'Accept': 'application/vnd.github+json',
      ...(opts.headers || {}),
    },
  });
  if (!res.ok && res.status !== 404) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `API ${res.status}`);
  }
  return res;
}
function b64encode(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64decode(s) { return decodeURIComponent(escape(atob(s))); }
function setStatus(msg) { document.getElementById('statusMsg').textContent = msg; }

// ==================== 初始化 ====================
async function init() {
  setStatus('读取仓库结构…');
  try {
    const res = await gh(`/repos/${OWNER}/${REPO}/contents/`);
    const items = await res.json();
    const folders = [];
    const rootNotes = [];
    for (const item of items) {
      if (item.type === 'dir') {
        folders.push({ name: item.name, path: item.path, notes: [] });
      } else if (isNoteFile(item.name) && item.type === 'file') {
        rootNotes.push({ name: stripExt(item.name), path: item.path, sha: item.sha, legacy: item.name.endsWith('.md') });
      }
    }
    // 并行读取各文件夹
    await Promise.all(folders.map(async (f) => {
      const fres = await gh(`/repos/${OWNER}/${REPO}/contents/${f.path}`);
      const fitems = await fres.json();
      if (Array.isArray(fitems)) {
        f.notes = fitems
          .filter(x => isNoteFile(x.name) && x.type === 'file')
          .map(x => ({ name: stripExt(x.name), path: x.path, sha: x.sha, legacy: x.name.endsWith('.md') }));
      }
    }));
    if (rootNotes.length > 0) {
      folders.unshift({ name: '未分区', path: '', notes: rootNotes, isRoot: true });
    }
    repoTree.folders = folders;
    renderSections();
    setStatus(`已连接 · ${folders.length} 个分区`);
  } catch (e) {
    setStatus('连接失败：' + e.message);
  }
}

function isNoteFile(name) { return name.endsWith('.html') || name.endsWith('.htm') || name.endsWith('.md'); }
function stripExt(name) { return name.replace(/\.(html?|md)$/i, ''); }

// ==================== 左侧列表 ====================
function renderSections() {
  const container = document.getElementById('folderList');
  container.innerHTML = '';
  if (repoTree.folders.length === 0) {
    container.innerHTML = '<div style="padding:14px;color:#888;font-size:13px">仓库里还没有笔记。<br>点击下方新建分区，或直接在状态栏新建笔记。</div>';
    return;
  }
  repoTree.folders.forEach(folder => {
    const header = document.createElement('div');
    header.className = 'folder';
    header.innerHTML = `<span>📁</span> ${folder.name} <span class="count">${folder.notes.length}</span>`;
    container.appendChild(header);
    folder.notes.forEach(note => {
      const div = document.createElement('div');
      div.className = 'note-item' + (openTabs[activeTabIndex]?.path === note.path ? ' active' : '');
      div.textContent = note.name;
      div.title = note.path;
      div.dataset.path = note.path;
      div.onclick = () => openNote(note.path, note.name, note.sha, note.legacy);
      container.appendChild(div);
    });
  });
}

function updateActiveHighlight() {
  const activePath = openTabs[activeTabIndex]?.path;
  document.querySelectorAll('.note-item').forEach(el => {
    el.classList.toggle('active', el.dataset.path === activePath);
  });
}

// ==================== 打开笔记 ====================
function openNote(path, name, sha, legacy) {
  const existing = openTabs.findIndex(t => t.path === path);
  if (existing >= 0) { switchTab(existing); return; }
  flushEditor();
  openTabs.push({ path, name, content: '', sha, dirty: false, loading: true, legacy: !!legacy });
  activeTabIndex = openTabs.length - 1;
  renderTabBar();
  renderEditor();
  updateSaveState();
  updateActiveHighlight();
  loadTabContent(activeTabIndex);
}

async function loadTabContent(index) {
  const tab = openTabs[index];
  if (!tab) return;
  try {
    const res = await gh(`/repos/${OWNER}/${REPO}/contents/${tab.path}`);
    const data = await res.json();
    const raw = b64decode(data.content);
    // .html 直接原样显示；旧 .md 用 marked 渲染一次
    tab.content = tab.legacy ? marked.parse(raw) : raw;
    tab.sha = data.sha;
    tab.loading = false;
    if (activeTabIndex === index) renderEditor();
    renderTabBar();
  } catch (e) {
    setStatus('读取失败：' + e.message);
    tab.loading = false;
  }
}

// ==================== 编辑器渲染（零输入开销） ====================
function renderEditor() {
  const tab = openTabs[activeTabIndex];
  if (!tab) { editor.innerHTML = ''; return; }
  if (tab.loading) { editor.innerHTML = '<p style="color:#999">读取中…</p>'; return; }
  if (editor.innerHTML !== tab.content) {
    editor.innerHTML = tab.content;
  }
}

// 输入：只标记 dirty，完全不解析、不重绘
editor.addEventListener('input', () => {
  const tab = openTabs[activeTabIndex];
  if (!tab) return;
  tab.dirty = true;
  updateSaveState();
});

// 切换前把编辑器内容读回 tab
function flushEditor() {
  const tab = openTabs[activeTabIndex];
  if (tab && !tab.loading) tab.content = editor.innerHTML;
}

// ==================== 标签栏 ====================
function renderTabBar() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  openTabs.forEach((tab, i) => {
    const el = document.createElement('div');
    el.className = 'edit-tab' + (i === activeTabIndex ? ' active' : '');
    el.onclick = () => switchTab(i);
    el.innerHTML = `${tab.dirty ? '<span class="dot"></span>' : ''} ${tab.name} <span class="close" onclick="event.stopPropagation(); closeTab(${i})">×</span>`;
    bar.appendChild(el);
  });
}

function switchTab(index) {
  if (index === activeTabIndex) return;
  flushEditor();
  activeTabIndex = index;
  renderTabBar();
  renderEditor();
  updateSaveState();
  updateActiveHighlight();
}

function closeTab(index) {
  const tab = openTabs[index];
  if (tab.dirty && !confirm(`「${tab.name}」有未保存修改，确定关闭？`)) return;
  openTabs.splice(index, 1);
  if (openTabs.length === 0) activeTabIndex = -1;
  else if (activeTabIndex >= openTabs.length) activeTabIndex = openTabs.length - 1;
  else if (index <= activeTabIndex && activeTabIndex > 0) activeTabIndex--;
  renderTabBar();
  renderEditor();
  updateSaveState();
  updateActiveHighlight();
}

function updateSaveState() {
  const tab = openTabs[activeTabIndex];
  const el = document.getElementById('saveState');
  if (!tab) { el.textContent = '—'; return; }
  el.textContent = tab.dirty ? '● 未保存 · 点击保存' : '已保存 ✓';
  el.style.color = tab.dirty ? '#c00' : '#2a7a2a';
}

// ==================== 保存（SHA 乐观锁 + 局部更新） ====================
async function saveCurrent() {
  flushEditor();
  const tab = openTabs[activeTabIndex];
  if (!tab || tab.loading) return;

  setStatus('保存中…');
  try {
    // 旧 .md 文件另存为 .html
    let savePath = tab.path;
    let saveSha = tab.sha;
    if (tab.legacy) {
      savePath = tab.path.replace(/\.md$/i, '.html');
      saveSha = null;
      const check = await gh(`/repos/${OWNER}/${REPO}/contents/${savePath}`);
      if (check.ok) { const meta = await check.json(); saveSha = meta.sha; }
    }

    // 保存前获取远端最新 SHA（仅对已存在文件）
    let remoteSha = null, remoteContent = null;
    const getRes = await gh(`/repos/${OWNER}/${REPO}/contents/${savePath}`);
    if (getRes.ok) {
      const meta = await getRes.json();
      remoteSha = meta.sha;
      remoteContent = b64decode(meta.content);
    }

    // 冲突检测
    if (saveSha && remoteSha && saveSha !== remoteSha && remoteContent !== tab.content) {
      const choice = await showConflictDialog(tab, remoteContent);
      if (choice === 'cancel') { setStatus('已取消保存'); return; }
      if (choice === 'merge') {
        tab.content = remoteContent;
        tab.sha = remoteSha;
        tab.dirty = true;
        renderEditor();
        setStatus('已载入远端最新版本，请合并后再次保存。');
        return;
      }
      if (choice === 'overwrite') saveSha = remoteSha;
    }

    const body = {
      message: `更新 ${savePath}`,
      content: b64encode(tab.content),
    };
    if (remoteSha) body.sha = remoteSha;   // 更新必带最新 SHA

    const res = await gh(`/repos/${OWNER}/${REPO}/contents/${savePath}`, {
      method: 'PUT',
      body: JSON.stringify(body),
      headers: { 'Content-Type': 'application/json' },
    });
    const data = await res.json();
    tab.path = savePath;
    tab.name = stripExt(savePath.split('/').pop());
    tab.sha = data.content.sha;
    tab.legacy = false;
    tab.dirty = false;
    updateSaveState();
    renderTabBar();
    upsertNoteSha(tab.path, tab.sha);   // 局部更新，不 init()
    updateActiveHighlight();
    setStatus('已保存 ✓');
  } catch (e) {
    if (e.message.includes('409') || e.message.includes('422')) {
      alert('保存被拒绝：远端在提交前又被修改了。请再次保存以查看最新版本。');
    } else {
      alert('保存失败：' + e.message);
    }
    setStatus('保存失败');
  }
}

// 局部更新左侧列表的 SHA / 新增条目
function upsertNoteSha(path, sha) {
  for (const folder of repoTree.folders) {
    const note = folder.notes.find(n => n.path === path);
    if (note) { note.sha = sha; return; }
  }
  const parts = path.split('/');
  const folderName = parts.length > 1 ? parts[0] : '';
  let folder = repoTree.folders.find(f => (f.path === folderName) || (folderName === '' && f.isRoot));
  if (!folder) {
    folder = { name: folderName || '未分区', path: folderName, notes: [], isRoot: folderName === '' };
    repoTree.folders.push(folder);
  }
  folder.notes.push({ name: stripExt(parts[parts.length - 1]), path, sha, legacy: false });
  renderSections();
}

function showConflictDialog(tab, remoteContent) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px';
    overlay.innerHTML = `
      <div style="background:#fff;border-radius:10px;padding:20px;max-width:640px;width:100%;max-height:80vh;display:flex;flex-direction:column">
        <h3 style="margin-bottom:8px">⚠️ 这篇笔记已被对方修改</h3>
        <p style="font-size:13px;color:#555;margin-bottom:12px">对方的最新版本如下。选择“载入合并”会把对方内容放进来，你手动合并后再保存；选择“强制覆盖”会用你的版本覆盖对方改动。</p>
        <div style="background:#f5f3f0;padding:12px;border-radius:6px;overflow:auto;font-size:13px;max-height:40vh">${remoteContent}</div>
        <div style="display:flex;gap:10px;margin-top:14px;justify-content:flex-end">
          <button onclick="resolveConflict('cancel')" style="padding:8px 16px;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer">取消</button>
          <button onclick="resolveConflict('overwrite')" style="padding:8px 16px;border:1px solid #c00;background:#fff;color:#c00;border-radius:6px;cursor:pointer">强制覆盖</button>
          <button onclick="resolveConflict('merge')" style="padding:8px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;cursor:pointer">载入对方版本合并</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    window.resolveConflict = (choice) => {
      overlay.remove();
      delete window.resolveConflict;
      resolve(choice);
    };
  });
}

// ==================== 新建 ====================
async function createNote() {
  const folder = prompt('输入分区名称（留空则放在根目录）：') || '';
  const name = prompt('输入笔记名称：');
  if (!name) return;
  const path = folder ? `${folder}/${name}.html` : `${name}.html`;
  if (folder) {
    const fRes = await gh(`/repos/${OWNER}/${REPO}/contents/${folder}`);
    if (fRes.status === 404) {
      await gh(`/repos/${OWNER}/${REPO}/contents/${folder}/.gitkeep`, {
        method: 'PUT',
        body: JSON.stringify({ message: `新建分区 ${folder}`, content: b64encode('') }),
        headers: { 'Content-Type': 'application/json' },
      });
    }
  }
  try {
    const res = await gh(`/repos/${OWNER}/${REPO}/contents/${path}`, {
      method: 'PUT',
      body: JSON.stringify({ message: `新建 ${path}`, content: b64encode('') }),
      headers: { 'Content-Type': 'application/json' },
    });
    const data = await res.json();
    await init();
    openNote(path, name, data.content.sha, false);
    setStatus('已创建：' + path);
  } catch (e) { alert('创建失败：' + e.message); }
}

function createFolder() {
  const name = prompt('新分区名称：');
  if (!name || !name.trim()) return;
  const folder = name.trim();
  gh(`/repos/${OWNER}/${REPO}/contents/${folder}/.gitkeep`, {
    method: 'PUT',
    body: JSON.stringify({ message: `新建分区 ${folder}`, content: b64encode('') }),
    headers: { 'Content-Type': 'application/json' },
  }).then(() => init()).then(() => setStatus('分区已创建：' + folder))
    .catch(e => alert('创建失败：' + e.message));
}

// ==================== 快捷键 ====================
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); saveCurrent(); }
});

document.getElementById('statusBar').insertAdjacentHTML('beforeend',
  '<span style="cursor:pointer;margin-left:8px" onclick="createNote()">＋ 新建笔记</span>');
</script>
</body>
</html>
